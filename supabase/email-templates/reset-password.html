<!--
  BAPL 비밀번호 재설정 메일 템플릿
  Supabase 대시보드 → Authentication → Emails → "Reset Password" 에 붙여넣어 사용.
  Supabase 변수: {{ .ConfirmationURL }}
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f6f7f9;margin:0;padding:32px 12px;font-family:-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;background-color:#ffffff;border-radius:20px;overflow:hidden;border:1px solid #e4e6ea;">

        <!-- 헤더 -->
        <tr>
          <td align="center" style="padding:36px 32px 8px 32px;">
            <div style="font-size:30px;font-weight:900;letter-spacing:-1.5px;line-height:1;">
              <span style="color:#17181c;">BA</span><span style="color:#00a552;">PL</span>
            </div>
            <div style="margin-top:8px;font-size:11px;letter-spacing:2px;color:#8b8f98;text-transform:uppercase;">
              Bike &amp; Adventure Platform
            </div>
          </td>
        </tr>

        <!-- 본문 -->
        <tr>
          <td style="padding:28px 32px 8px 32px;">
            <h1 style="margin:0 0 12px 0;font-size:20px;font-weight:800;color:#17181c;letter-spacing:-0.3px;">
              비밀번호를 재설정해 주세요
            </h1>
            <p style="margin:0;font-size:14px;line-height:1.7;color:#5a5e67;">
              비밀번호 재설정 요청이 접수되었습니다.<br />
              아래 버튼을 눌러 새 비밀번호를 설정해 주세요.
            </p>
          </td>
        </tr>

        <!-- CTA -->
        <tr>
          <td align="center" style="padding:24px 32px 8px 32px;">
            <a href="{{ .ConfirmationURL }}"
               style="display:inline-block;background-color:#00a552;color:#ffffff;text-decoration:none;font-size:15px;font-weight:700;padding:14px 36px;border-radius:12px;">
              새 비밀번호 설정하기
            </a>
          </td>
        </tr>

        <!-- 대체 링크 -->
        <tr>
          <td style="padding:16px 32px 0 32px;">
            <p style="margin:0;font-size:12px;line-height:1.7;color:#8b8f98;">
              버튼이 눌리지 않으면 아래 주소를 브라우저에 붙여넣어 주세요.
            </p>
            <p style="margin:6px 0 0 0;font-size:12px;line-height:1.6;word-break:break-all;">
              <a href="{{ .ConfirmationURL }}" style="color:#00a552;text-decoration:underline;">{{ .ConfirmationURL }}</a>
            </p>
          </td>
        </tr>

        <!-- 안내 -->
        <tr>
          <td style="padding:24px 32px 0 32px;">
            <div style="border-top:1px solid #e4e6ea;padding-top:20px;">
              <p style="margin:0;font-size:12px;line-height:1.7;color:#8b8f98;">
                본인이 요청하지 않았다면 이 메일은 무시하셔도 됩니다.<br />
                기존 비밀번호는 그대로 유지되며, 재설정 링크는 일정 시간이 지나면 만료됩니다.
              </p>
            </div>
          </td>
        </tr>

        <!-- 푸터 -->
        <tr>
          <td align="center" style="padding:24px 32px 32px 32px;">
            <p style="margin:0;font-size:11px;line-height:1.8;color:#a6acb4;">
              <a href="https://bapl.co.kr" style="color:#5a5e67;text-decoration:none;font-weight:600;">bapl.co.kr</a><br />
              바이크를 사랑하는 사람들을 위한 커뮤니티 &amp; 종합 플랫폼
            </p>
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>
